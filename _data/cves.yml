# cvss: CVSS v3.1 base score (NVD primary)
# writeup_url / msrc_url: leave empty string if not applicable

- id: CVE-2024-43616
  title: Microsoft Office Remote Code Execution Vulnerability
  severity: HIGH
  cvss: "7.8"
  year: 2024
  product: Microsoft Office 2013 – 2024, Microsoft 365 Apps (Enterprise)
  description: >
    An untrusted search path (CWE-426) vulnerability in Microsoft Office allows a local
    attacker with no required privileges to execute arbitrary code. Affects virtually all
    versions of Microsoft Office going back over a decade — Microsoft 365 Apps for
    Enterprise, Office LTSC 2024, Office LTSC 2021, Office 2019, Office 2016, and
    Office 2013.
  nvd_url: https://nvd.nist.gov/vuln/detail/CVE-2024-43616
  msrc_url: https://msrc.microsoft.com/update-guide/vulnerability/CVE-2024-43616
  writeup_url: ""

- id: CVE-2024-43379
  title: Blind Server-Side Request Forgery (SSRF) in TruffleHog Secrets Scanner
  severity: LOW
  cvss: "3.1"
  year: 2024
  product: TruffleHog < v3.81.9
  description: >
    Certain TruffleHog detectors capture an endpoint from scanned data and issue a GET
    request to it during verification. Combined with Go's HTTP library automatically
    following redirects, an attacker who can inject a payload into scanned data can
    trigger blind SSRF against internal services — potentially reaching systems that
    straddle internal networks. Patched in v3.81.9.
  nvd_url: https://nvd.nist.gov/vuln/detail/CVE-2024-43379
  msrc_url: ""
  writeup_url: https://trufflesecurity.com/blog/contributor-spotlight-karan-bamal

- id: CVE-2024-31954
  title: Local Privilege Escalation via DLL Hijacking in Samsung Portable SSD T5 Installer
  severity: HIGH
  cvss: "7.3"
  year: 2024
  product: Samsung Portable SSD T5 PC Software v1.6.10 (Windows)
  description: >
    An issue was discovered in the installer in Samsung Portable SSD for T5 1.6.10 on
    Windows. Because it is possible to tamper with the directory and DLL files used during
    the installation process, an attacker can escalate privileges through arbitrary code
    execution. An attacker must already have user privileges to exploit this vulnerability.
  nvd_url: https://nvd.nist.gov/vuln/detail/CVE-2024-31954
  msrc_url: ""
  writeup_url: ""


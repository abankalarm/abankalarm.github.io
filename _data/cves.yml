- id: CVE-2022-0916
  title: OAuth 2.0 CSRF in Logitech Options
  severity: HIGH
  cvss: "8.8"
  year: 2022
  product: Logitech Options < v9.60.87 (Windows)
  description: >
    The OAuth 2.0 state parameter in Logitech Options is not properly validated,
    leaving the authentication and authorization flow vulnerable to CSRF attacks during
    authentication and authorization operations. Can be chained with CVE-2022-0915
    for full remote code execution.
  nvd_url: https://nvd.nist.gov/vuln/detail/CVE-2022-0916
  msrc_url: ""
  writeup_url: ""

- id: CVE-2022-0915
  title: TOCTOU Race Condition Local Privilege Escalation in Logitech Sync
  severity: HIGH
  cvss: "7.0"
  year: 2022
  product: Logitech Sync < v2.4.574 (Windows)
  description: >
    A Time-of-check Time-of-use (TOCTOU) race condition in Logitech Sync for Windows
    prior to v2.4.574. Successful exploitation may escalate permissions to the system
    user. Chained with CVE-2022-0916, a network-based CSRF pivots into full local
    privilege escalation.
  nvd_url: https://nvd.nist.gov/vuln/detail/CVE-2022-0915
  msrc_url: ""
  writeup_url: ""

- id: CVE-2020-28463
  title: Server-Side Request Forgery (SSRF) via img Tags in Python ReportLab
  severity: MEDIUM
  cvss: "6.5"
  year: 2021
  product: ReportLab (all versions, Python)
  description: >
    All versions of package reportlab are vulnerable to Server-side Request Forgery (SSRF)
    via img tags. By injecting a crafted img src into text being converted to PDF, an
    attacker can cause the server to issue arbitrary HTTP requests to internal or
    attacker-controlled endpoints, leaking internal infrastructure details.
  nvd_url: https://nvd.nist.gov/vuln/detail/CVE-2020-28463
  msrc_url: ""
  writeup_url: ""
